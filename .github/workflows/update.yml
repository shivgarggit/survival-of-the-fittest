name: Refresh strategy data

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight - check everything is in place
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: |
          echo "=== files in the repository root ==="
          ls -la
          echo
          echo "=== site folder ==="
          ls -la site 2>/dev/null || echo "  site/ DOES NOT EXIST"
          echo
          fail=0
          for f in weights.xlsx refresh_data.py build_site.py site/index.html site/app.js; do
            if [ -f "$f" ]; then echo "OK      $f"
            else echo "MISSING $f"; fail=1; fi
          done
          if grep -q "yfinance" refresh_data.py 2>/dev/null; then
            echo "PROBLEM refresh_data.py is still the OLD yfinance version - replace it"
            fail=1
          else
            echo "OK      refresh_data.py is the Tiingo version"
          fi
          if [ -z "$TIINGO_TOKEN" ]; then
            echo "PROBLEM TIINGO_TOKEN secret is empty or was never created"
            echo "        Settings > Secrets and variables > Actions > New repository secret"
            fail=1
          else
            echo "OK      TIINGO_TOKEN is set (${#TIINGO_TOKEN} characters)"
          fi
          echo
          if [ "$fail" = "1" ]; then
            echo "Preflight failed - fix the PROBLEM/MISSING lines above and re-run."
            exit 1
          fi
          echo "Preflight passed."

      - name: Install dependencies
        run: pip install --quiet openpyxl

      - name: Pull market data
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: python refresh_data.py --workbook weights.xlsx --json engine_data.json

      - name: Build published payload
        run: python build_site.py --data engine_data.json --out site/portfolio.json --adjclose

      - name: Fail if a price series leaked into the payload
        run: |
          python - <<'PYEOF'
          import json
          p = json.load(open('site/portfolio.json'))
          assert 'px' not in p, 'price block present in published payload'
          allowed = {'Strategy','SPY','QQQ','SPMO','XLG','MAGS','RSP','PSLDX'}
          assert set(p['series']) <= allowed, 'unexpected series: %s' % (set(p['series']) - allowed)
          n = len(p['dates'])
          assert n > 500, 'suspiciously short history: %d days' % n
          assert all(len(v) == n for v in p['series'].values()), 'series length mismatch'
          print('payload OK: %d days, %d series, %d quarters' % (n, len(p['series']), len(p['quarters'])))
          PYEOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
